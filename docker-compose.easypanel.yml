# DeskcommCRM para EasyPanel. O Traefik do painel fornece domínio e HTTPS;
# por isso esta stack não publica 80/443 e não inicia Caddy.

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  SUPABASE_DB_URL: ${SUPABASE_DB_URL}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
  APP_NAME: ${APP_NAME:-DeskcommCRM}
  APP_LOGO_URL: ${APP_LOGO_URL:-}
  INTERNAL_SECRET: ${INTERNAL_SECRET}
  INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
  CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
  NUVEMSHOP_OAUTH_ENCRYPTION_KEY: ${NUVEMSHOP_OAUTH_ENCRYPTION_KEY}
  WAHA_BYO_ENCRYPTION_KEY: ${WAHA_BYO_ENCRYPTION_KEY}
  AI_CRED_AES_KEY: ${AI_CRED_AES_KEY}
  IMPERSONATE_COOKIE_SECRET: ${IMPERSONATE_COOKIE_SECRET}
  LGPD_SIGNING_KEY: ${LGPD_SIGNING_KEY}
  WAHA_API_BASE_URL: http://waha:3000
  WAHA_WEBHOOK_BASE_URL: http://app:3000
  WAHA_API_KEY: ${WAHA_API_KEY}
  WAHA_HMAC_SECRET: ${WAHA_HMAC_SECRET}
  UPSTASH_REDIS_REST_URL: http://srh:80
  UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
  VERCEL_AI_GATEWAY_URL: ${VERCEL_AI_GATEWAY_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AGENT_DISPATCH_CONSUMER: ${AGENT_DISPATCH_CONSUMER:-engine}
  EVENT_LOG_WORKER_ENABLED: ${EVENT_LOG_WORKER_ENABLED:-false}
  INTERNAL_AGENT_RUN_STUB: ${INTERNAL_AGENT_RUN_STUB:-false}
  SENTRY_DSN: ${SENTRY_DSN:-}
  NUVEMSHOP_ENABLED: ${NUVEMSHOP_ENABLED:-false}
  NUVEMSHOP_APP_ID: ${NUVEMSHOP_APP_ID:-}
  NUVEMSHOP_CLIENT_ID: ${NUVEMSHOP_CLIENT_ID:-}
  NUVEMSHOP_CLIENT_SECRET: ${NUVEMSHOP_CLIENT_SECRET:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:latest}
    pull_policy: always
    environment: *runtime-environment
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *runtime-environment
    depends_on:
      app:
        condition: service_healthy
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha}
    environment:
      WAHA_API_KEY: sha512:${WAHA_API_KEY_SHA512}
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message,message.any,message.ack,session.status,state.change
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks: [internal]

  srh:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

  scheduler:
    image: alpine:3.20
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null 2>&1
        cat > /etc/crontabs/root <<EOF
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/agent-dispatcher >/dev/null 2>&1
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/followup-flow-worker >/dev/null 2>&1
        * * * * * curl -fsS -m45 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/event-log-drain >/dev/null 2>&1
        */5 * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" "http://app:3000/api/v1/cron/storage-redaction?limit=50" >/dev/null 2>&1
        */5 * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/snooze-watcher >/dev/null 2>&1
        0 12 * * * curl -fsS -m60 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/lgpd-sla-watcher >/dev/null 2>&1
        30 3 * * * curl -fsS -m120 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/kb-conversations-batch >/dev/null 2>&1
        EOF
        exec crond -f -l 2
    logging: *default-logging
    networks: [internal]

volumes:
  waha-data:
  waha-media:

networks:
  internal:

