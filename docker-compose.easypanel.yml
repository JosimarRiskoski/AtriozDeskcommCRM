# DeskcommCRM para EasyPanel. O Traefik do painel fornece domínio e HTTPS;
# por isso esta stack não publica 80/443 e não inicia Caddy.

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  SUPABASE_DB_URL: ${SUPABASE_DB_URL}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
  APP_NAME: ${APP_NAME:-Atrios CRM Inteligente}
  APP_LOGO_URL: ${APP_LOGO_URL:-}
  INTERNAL_SECRET: ${INTERNAL_SECRET}
  INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
  CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
  NUVEMSHOP_OAUTH_ENCRYPTION_KEY: ${NUVEMSHOP_OAUTH_ENCRYPTION_KEY}
  AI_CRED_AES_KEY: ${AI_CRED_AES_KEY}
  IMPERSONATE_COOKIE_SECRET: ${IMPERSONATE_COOKIE_SECRET}
  LGPD_SIGNING_KEY: ${LGPD_SIGNING_KEY}
  EVOLUTION_API_BASE_URL: http://evolution:8080
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
  EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
  UPSTASH_REDIS_REST_URL: http://srh:80
  UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
  VERCEL_AI_GATEWAY_URL: ${VERCEL_AI_GATEWAY_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  AGENT_DISPATCH_CONSUMER: ${AGENT_DISPATCH_CONSUMER:-engine}
  EVENT_LOG_WORKER_ENABLED: ${EVENT_LOG_WORKER_ENABLED:-false}
  INTERNAL_AGENT_RUN_STUB: ${INTERNAL_AGENT_RUN_STUB:-false}
  SENTRY_DSN: ${SENTRY_DSN:-}
  NUVEMSHOP_ENABLED: ${NUVEMSHOP_ENABLED:-false}
  NUVEMSHOP_APP_ID: ${NUVEMSHOP_APP_ID:-}
  NUVEMSHOP_CLIENT_ID: ${NUVEMSHOP_CLIENT_ID:-}
  NUVEMSHOP_CLIENT_SECRET: ${NUVEMSHOP_CLIENT_SECRET:-}
  GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
  GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    # Build the application from this repository. Using the upstream `latest`
    # image here silently discarded every customization made in the Atrioz
    # fork whenever EasyPanel redeployed the stack.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      srh:
        condition: service_started
      evolution:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      app:
        condition: service_healthy
      evolution:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  evolution:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://evolution:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/${EVOLUTION_DB_NAME:-evolution}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: atrios-crm-inteligente
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: atrios-evolution
      WEBHOOK_GLOBAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
    volumes:
      - evolution-instances:/evolution/instances
    logging: *default-logging
    networks: [internal]

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks: [internal]

  srh:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null 2>&1
        cat > /etc/crontabs/root <<EOF
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/whatsapp-inbound-recovery >/dev/null 2>&1
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/followup-flow-worker >/dev/null 2>&1
        * * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/calendar-reminders >/dev/null 2>&1
        */5 * * * * curl -fsS -m120 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/google-calendar-sync >/dev/null 2>&1
        * * * * * curl -fsS -m45 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/campaign-worker >/dev/null 2>&1
        * * * * * curl -fsS -m45 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/meta-capi-worker >/dev/null 2>&1
        * * * * * curl -fsS -m45 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/notification-delivery >/dev/null 2>&1
        * * * * * curl -fsS -m45 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/event-log-drain >/dev/null 2>&1
        */5 * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" "http://app:3000/api/v1/cron/storage-redaction?limit=50" >/dev/null 2>&1
        */5 * * * * curl -fsS -m25 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/snooze-watcher >/dev/null 2>&1
        0 12 * * * curl -fsS -m60 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/lgpd-sla-watcher >/dev/null 2>&1
        30 3 * * * curl -fsS -m120 -H "Authorization: Bearer $$INTERNAL_SECRET" http://app:3000/api/v1/cron/kb-conversations-batch >/dev/null 2>&1
        EOF
        exec crond -f -l 2
    logging: *default-logging
    networks: [internal]

volumes:
  evolution-instances:
  evolution-postgres-data:

networks:
  internal:
